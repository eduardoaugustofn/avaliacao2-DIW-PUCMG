<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votação 2026 - Resultado</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/logo-fazenda.jpg" alt="Logo A Fazenda">
        Votação 2026
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="votacao.html">Votar</a></li>
          <li class="nav-item"><a class="nav-link active" href="resultado.html">Resultado</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Parcial da eliminação</h1>
    <p class="fs-5"><span class="fs-2 fw-bold" id="total-votos">0</span> votos computados</p>

    <div id="sem-votos" class="d-none text-center py-4">
      <p class="fs-5">Nenhum voto computado. Escolha quem vai ser o roceiro!</p>
      <a href="votacao.html" class="btn btn-warning btn-lg">Ir para a votação</a>
    </div>

    <div id="lista-resultado"></div>

    <button class="btn btn-outline-light mt-2" id="btn-zerar" data-bs-toggle="modal" data-bs-target="#modal-zerar">Zerar votação</button>
  </main>

  <div class="modal fade" id="modal-zerar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Zerar votação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">Tem certeza que quer apagar todos os votos? Essa ação não dá pra desfazer.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="btn-confirmar-zerar">Sim, zerar</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center py-4">DIW 2026, PUC Minas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const totalVotos = document.getElementById("total-votos");
    const listaResultado = document.getElementById("lista-resultado");
    const semVotos = document.getElementById("sem-votos");
    const btnZerar = document.getElementById("btn-zerar");
    const btnConfirmar = document.getElementById("btn-confirmar-zerar");

    async function carregarResultado() {
      try {
        const naRoca = await listarNaRoca();
        const votos = await listarVotos();

        totalVotos.textContent = votos.length;
        listaResultado.innerHTML = "";

        if (votos.length === 0) {
          semVotos.classList.remove("d-none");
          btnZerar.classList.add("d-none");
          return;
        }

        semVotos.classList.add("d-none");
        btnZerar.classList.remove("d-none");

        const resultado = calcularResultado(naRoca, votos);
        resultado.forEach(function (p, i) {
          const lider = i === 0;
          listaResultado.innerHTML += `
            <div class="card item-placar mb-3 ${lider ? "lider" : ""}">
              <div class="card-body d-flex align-items-center gap-3">
                <img src="${p.foto}" class="foto-placar" alt="${p.nome}">
                <div class="flex-grow-1">
                  <h5 class="nome-peao mb-2">${p.nome}
                    ${lider ? '<span class="badge bg-danger fs-6">Sairia hoje</span>' : ""}
                  </h5>
                  <div class="progress" style="height: 20px;">
                    <div class="progress-bar ${lider ? "bg-danger" : ""}" role="progressbar" style="width: ${p.percentual}%"></div>
                  </div>
                  <strong>${formatarPercentual(p.percentual)} (${p.votos} ${p.votos === 1 ? "voto" : "votos"})</strong>
                </div>
              </div>
            </div>`;
        });
      } catch (erro) {
        listaResultado.innerHTML = '<p class="text-light">Não foi possível carregar o resultado.</p>';
      }
    }

    btnConfirmar.addEventListener("click", async function () {
      await zerarVotos();
      await carregarResultado();
      const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("modal-zerar"));
      modal.hide();
    });

    carregarResultado();
  </script>
</body>
</html>
