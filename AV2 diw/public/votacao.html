<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votação 2026 - Votar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/logo-fazenda.jpg" alt="Logo A Fazenda">
        Votação 2026
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active" href="votacao.html">Votar</a></li>
          <li class="nav-item"><a class="nav-link" href="resultado.html">Resultado</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Quem você quer eliminar?</h1>
    <p>Cada voto conta pra definir o futuro da fazenda.</p>

    <div id="area-alerta"></div>

    <div class="row row-cols-1 row-cols-md-3 g-4" id="grade-roca"></div>

    <h3 class="mt-5 mb-3">Os demais peões</h3>
    <div class="row row-cols-3 row-cols-md-4 row-cols-lg-6 g-3" id="grade-demais"></div>
  </main>

  <footer class="text-center py-4">DIW 2026, PUC Minas</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const gradeRoca = document.getElementById("grade-roca");
    const gradeDemais = document.getElementById("grade-demais");
    const areaAlerta = document.getElementById("area-alerta");

    let meusVotos = 0;

    async function carregarVotacao() {
      try {
        const naRoca = await listarNaRoca();
        const demais = await listarForaDaRoca();

        gradeRoca.innerHTML = "";
        naRoca.forEach(function (p) {
          gradeRoca.innerHTML += `
            <div class="col">
              <div class="card h-100">
                <img src="${p.foto}" class="card-img-top" alt="${p.nome}" onerror="this.src='img/logo-fazenda.jpg'">
                <div class="card-body text-center">
                  <span class="badge bg-danger mb-2">Na roça</span>
                  <h5 class="card-title nome-peao">${p.nome}</h5>
                  <button class="btn btn-danger w-100" onclick="votar(${p.id}, '${p.nome}')">Votar para eliminar</button>
                </div>
              </div>
            </div>`;
        });

        gradeDemais.innerHTML = "";
        demais.forEach(function (p) {
          gradeDemais.innerHTML += `
            <div class="col">
              <div class="card h-100 card-pequeno">
                <img src="${p.foto}" class="card-img-top" alt="${p.nome}" onerror="this.src='img/logo-fazenda.jpg'">
                <div class="card-body p-2 text-center">
                  <small>${p.nome}</small>
                </div>
              </div>
            </div>`;
        });
      } catch (erro) {
        gradeRoca.innerHTML = '<p class="text-light">Não foi possível carregar os participantes.</p>';
      }
    }

    async function votar(id, nome) {
      try {
        await registrarVoto(id);
        meusVotos++;
        const vezes = meusVotos === 1 ? "1 vez" : meusVotos + " vezes";
        areaAlerta.innerHTML = `
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            Você votou em <strong>${nome}</strong>! Você já votou ${vezes}.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
          </div>`;
      } catch (erro) {
        areaAlerta.innerHTML = '<div class="alert alert-danger">Erro ao registrar o voto. Tente de novo.</div>';
      }
    }

    carregarVotacao();
  </script>
</body>
</html>
